version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: humanly_social_postgres
    restart: always
    environment:
      POSTGRES_USER: jules
      POSTGRES_PASSWORD: password
      POSTGRES_DB: humanly_social_control_plane
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jules -d humanly_social_control_plane"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: humanly_social_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
